<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="pl-title pl-desc">
  <title id="pl-title">How a streamed reply becomes speech</title>
  <desc id="pl-desc">message_update deltas feed the active mode's parser (tag or stream), which flushes speakable spans to clean(), which strips code/tables/markup, then dispatches to the configured endpoint via execFile with no shell involved. Synthesis is pipelined ahead of playback so there is no dead air between utterances.</desc>

  <rect width="1200" height="320" rx="26" fill="#0b0d10"/>

  <text x="56" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="1" fill="#f2b84b">HOW A STREAMED REPLY BECOMES SPEECH</text>

  <!-- stage 1 -->
  <g transform="translate(56 92)">
    <rect width="248" height="176" rx="12" fill="#131519" stroke="#23262b" stroke-width="1"/>
    <text x="20" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f2b84b">message_update</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9c2d9">text_delta events arrive</text>
    <text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9c2d9">while the model is still</text>
    <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9c2d9">generating</text>
    <text x="20" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565b61">thinking + tool-call</text>
    <text x="20" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565b61">deltas are ignored</text>
  </g>

  <path d="M 316 180 L 364 180" stroke="#3a3f45" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- stage 2 -->
  <g transform="translate(376 92)">
    <rect width="220" height="176" rx="12" fill="#131519" stroke="#23262b" stroke-width="1"/>
    <text x="20" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f2b84b">parser</text>
    <rect x="20" y="50" width="180" height="42" rx="8" fill="#0b0d10" stroke="#3a3f45" stroke-width="1"/>
    <text x="32" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9aa0a6">stream (default)</text>
    <text x="32" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#565b61">flush on blank line</text>
    <rect x="20" y="100" width="180" height="42" rx="8" fill="#0b0d10" stroke="#4a3f2a" stroke-width="1"/>
    <text x="32" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#f2b84b">tag</text>
    <text x="32" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#565b61">flush on &lt;/say&gt;</text>
  </g>

  <path d="M 596 180 L 644 180" stroke="#3a3f45" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- stage 3 -->
  <g transform="translate(656 92)">
    <rect width="220" height="176" rx="12" fill="#131519" stroke="#23262b" stroke-width="1"/>
    <text x="20" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f2b84b">clean()</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9c2d9">strips code, tables,</text>
    <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9c2d9">markup, links, emoji</text>
    <text x="20" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565b61">zero model calls &#8212;</text>
    <text x="20" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565b61">plain text parsing,</text>
    <text x="20" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565b61">zero extra tokens</text>
  </g>

  <path d="M 876 180 L 924 180" stroke="#3a3f45" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- stage 4 -->
  <g transform="translate(936 92)">
    <rect width="208" height="176" rx="12" fill="#131519" stroke="#4a3f2a" stroke-width="1"/>
    <text x="20" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f2b84b">execFile()</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9c2d9">no shell &#8212; nothing</text>
    <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9c2d9">in a reply can inject</text>
    <text x="20" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#e0c9b8">next utterance synths</text>
    <text x="20" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#e0c9b8">while this one plays</text>
    <text x="20" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#565b61">&#8212; no dead air</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3f45"/>
    </marker>
  </defs>
</svg>
