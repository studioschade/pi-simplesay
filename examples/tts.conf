# SimpleSay TTS Configuration
# This file is sourced by endpoint.sh to configure TTS provider

# TTS Provider: piper | espeak-ng | pico2wave | kokoro
# kokoro (this box): resident Kokoro TTS server, OpenAI-compatible API,
# managed by sovereign (koko-tts.service, ~/Agents/sovereign/Projects/kokoros)
TTS_PROVIDER="kokoro"

# Piper settings (neural TTS, best quality)
# Install: pip install piper-tts
# Voices: https://huggingface.co/rhasspy/piper-voices
PIPER_BIN="/home/alex/.local/bin/piper"
PIPER_VOICE="en_US-amy-medium"
PIPER_VOICES_DIR="/home/alex/piper-voices"

# espeak-ng settings (robotic but reliable, always available)
# Install: apt install espeak-ng
ESPEAK_VOICE="en-us"
ESPEAK_SPEED=150

# pico2wave settings (lightweight, decent quality)
# Install: apt install libttspico-utils
PICO2WAVE_LANG="en-US"

# Kokoro settings (resident local server, OpenAI-compatible /v1/audio/speech)
# Requires curl + python3 (used only to JSON-escape the text safely).
# Voice list: curl http://127.0.0.1:7790/v1/audio/voices
KOKORO_URL="http://127.0.0.1:7790"
KOKORO_MODEL="kokoro"
KOKORO_VOICE="am_puck"

# Audio playback
# Options: aplay | paplay | pw-play (PipeWire)
# Default: auto-detect
AUDIO_PLAYER=""
